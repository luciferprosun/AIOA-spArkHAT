[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "aioa-nonzero-cloudops-agent"
version = "0.2.0rc1"
description = "Non-Zero execution contracts for the AIOA CloudOps Agent"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "pydantic==2.13.4",
    "strands-agents[otel]==1.53.0",
    "uuid6==2025.0.1",
]

[project.optional-dependencies]
dev = [
    "PyYAML>=6.0,<7",
    "pytest>=8.3,<9",
    "ruff>=0.9,<1",
    "setuptools>=75,<83",
    "virtualenv>=20.35,<21",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]
