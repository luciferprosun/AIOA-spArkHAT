name: MCP Nebius Bridge

on:
  push:
    branches: [nebius-personal-ai]
    paths:
      - 'runtime/mcp_bridge/**'
      - 'MCP_Server/**'
      - 'tests/test_mcp_bridge_contract.py'
      - 'tests/test_mcp_task_bus.py'
      - 'tests/test_mcp_authority_projection.py'
      - 'tests/test_mcp_github_issue_transport.py'
      - 'tests/test_mcp_transport_claim.py'
      - '.github/workflows/mcp-nebius-bridge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: MCP contract (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile bridge
        run: python -m compileall -q runtime/mcp_bridge tests/test_mcp_bridge_contract.py
      - name: Run MCP bridge contract tests
        run: python -m unittest tests.test_mcp_bridge_contract tests.test_mcp_task_bus tests.test_mcp_authority_projection tests.test_mcp_github_issue_transport tests.test_mcp_transport_claim -v
