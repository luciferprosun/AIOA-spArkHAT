name: Filesystem effect and watcher observation

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/effect-observation-probe.yml'
      - 'tests/diagnostics/qwen_watcher/**'
      - 'docs/architecture/NATIVE69_EFFECT_OBSERVATION_PROBE.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paired-probe:
    name: Paired Chokidar probe (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
    env:
      AIOA_TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      CHOKIDAR_USEPOLLING: 'false'
    steps:
      - name: Initialize evidence before dependency setup
        shell: pwsh
        run: |
          $outputDir = Join-Path $env:RUNNER_TEMP 'aioa-effect-observation'
          New-Item -ItemType Directory -Force -Path $outputDir | Out-Null
          @{
            tested_sha = $env:AIOA_TESTED_SHA
            repository = $env:GITHUB_REPOSITORY
            run_id = $env:GITHUB_RUN_ID
            run_attempt = $env:GITHUB_RUN_ATTEMPT
            runner_os = $env:RUNNER_OS
            runner_image = $env:ImageOS
            runner_image_version = $env:ImageVersion
            operated_by = 'luciferprosun / LuciferSun, with ChatGPT assistance'
            separate_runner_operation = 'Own GitHub Actions workflow; not operated by KarmaDue or the first Qwen reporter'
          } | ConvertTo-Json | Set-Content -Path (Join-Path $outputDir 'runner.json') -Encoding utf8
      - id: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - id: node_setup
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.20.0'
      - name: Install only locked diagnostic dependencies
        id: install
        working-directory: tests/diagnostics/qwen_watcher
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $logPath = Join-Path $env:RUNNER_TEMP 'aioa-effect-observation/install.log'
          & npm ci --ignore-scripts --no-audit --no-fund 2>&1 | Tee-Object -FilePath $logPath
          $installExit = $LASTEXITCODE
          exit $installExit
      - name: Record Windows build and temporary-volume filesystem
        id: windows_metadata
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $osInfo = Get-CimInstance Win32_OperatingSystem
          $volume = Get-Volume -FilePath $env:RUNNER_TEMP
          $info = @{
            caption = $osInfo.Caption
            version = $osInfo.Version
            build_number = $osInfo.BuildNumber
            filesystem = $volume.FileSystemType.ToString()
            drive_letter = $volume.DriveLetter.ToString()
            runner_image = $env:ImageOS
            runner_image_version = $env:ImageVersion
          } | ConvertTo-Json -Compress
          $info | Set-Content -Path (Join-Path $env:RUNNER_TEMP 'aioa-effect-observation/windows.json') -Encoding utf8
          "QWEN_WATCHER_WINDOWS_INFO=$info" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Run three fresh raw and normalized pairs
        id: probe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $env:TEMP = $env:RUNNER_TEMP
          $env:TMP = $env:RUNNER_TEMP
          $env:TMPDIR = $env:RUNNER_TEMP
          $outputDir = Join-Path $env:RUNNER_TEMP 'aioa-effect-observation'
          New-Item -ItemType Directory -Force -Path $outputDir | Out-Null
          & node tests/diagnostics/qwen_watcher/probe.cjs `
            --output (Join-Path $outputDir 'result.json') --window-ms 5000 --pairs 3 `
            --credit LuciferSun 2>&1 | Tee-Object -FilePath (Join-Path $outputDir 'console.log')
          $probeExit = $LASTEXITCODE
          exit $probeExit
      - name: Record actual setup and capture outcomes
        if: always()
        shell: pwsh
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          NODE_SETUP_OUTCOME: ${{ steps.node_setup.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          WINDOWS_METADATA_OUTCOME: ${{ steps.windows_metadata.outcome }}
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
        run: |
          $outputDir = Join-Path $env:RUNNER_TEMP 'aioa-effect-observation'
          New-Item -ItemType Directory -Force -Path $outputDir | Out-Null
          @{
            checkout = $env:CHECKOUT_OUTCOME
            node_setup = $env:NODE_SETUP_OUTCOME
            install = $env:INSTALL_OUTCOME
            windows_metadata = $env:WINDOWS_METADATA_OUTCOME
            probe = $env:PROBE_OUTCOME
            qualification = 'Standalone watcher observations only; not Native qualification'
          } | ConvertTo-Json | Set-Content -Path (Join-Path $outputDir 'steps.json') -Encoding utf8
      - name: Preserve observations including setup blockers and unexpected traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: effect-observation-${{ matrix.os }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/aioa-effect-observation/
          if-no-files-found: warn
          retention-days: 14
