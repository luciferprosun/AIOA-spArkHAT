name: Core and native NonZero

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packaging:
    name: Installed packaging (${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned packaging test tools
        run: python -m pip install pip==25.2 setuptools==80.9.0 wheel==0.45.1
      - name: Build and test wheel and sdist without source imports or Textual
        run: python -B tests/packaging_acceptance.py --output "$RUNNER_TEMP/aioa-packaging-${{ matrix.python-version }}"

  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    env:
      PYTHONNOUSERSITE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      AIOA_TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      AWS_CONFIG_FILE: /dev/null
      AWS_SHARED_CREDENTIALS_FILE: /dev/null
      AWS_EC2_METADATA_DISABLED: 'true'
      OTEL_TRACES_EXPORTER: none
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.3'
      - name: Install one Core package and check dependencies
        run: |
          python -m pip install '.[nonzero]' ruff==0.16.7 cryptography==41.0.7 PyYAML==6.0.3
          python -m pip check
      - name: Verify checked-in Android source inventory before build
        run: |
          python -B - <<'PY'
          import os
          from scripts.android import toolchain_lib
          toolchain_lib.source_check(os.environ['AIOA_TESTED_SHA'])
          PY
      - name: NVIDIA isolated reviewer preflight
        working-directory: ${{ runner.temp }}
        run: python -I -B "$GITHUB_WORKSPACE/scripts/nvidia_reviewer_preflight.py" --root "$RUNNER_TEMP/aioa-nvidia-reviewer-${{ matrix.python-version }}"
      - name: Install pinned isolated browser prerequisites on hosted Noble
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          [[ "${RUNNER_ENVIRONMENT:-}" == github-hosted ]]
          [[ "${RUNNER_OS:-}" == Linux && "${RUNNER_ARCH:-}" == X64 ]]
          . /etc/os-release
          [[ "$ID" == ubuntu && "$VERSION_ID" == 24.04 && "${VERSION_CODENAME:-}" == noble ]]
          [[ "$(/usr/bin/dpkg --print-architecture)" == amd64 ]]
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes --allow-downgrades bubblewrap=0.9.0-1ubuntu0.3 python3-cryptography=41.0.7-4ubuntu0.4 git=1:2.43.0-1ubuntu7.4 git-man=1:2.43.0-1ubuntu7.4
          dpkg-query --show --showformat='${Package}=${Version}\n' bubblewrap python3-cryptography git git-man
      - name: Acquire pinned official Codex for isolated protocol diagnostics
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          probe_dir="$RUNNER_TEMP/aioa-codex-probe"
          mkdir -- "$probe_dir"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --output "$probe_dir/codex.tar.gz" https://github.com/openai/codex/releases/download/rust-v0.167.0/codex-x86_64-unknown-linux-musl.tar.gz
          printf '%s  %s\n' 9d64836106d5b374e90ee4454c7ebcde7ca7106558bd7e41a34b9f26ebda251a "$probe_dir/codex.tar.gz" | sha256sum --check --strict
          [[ "$(tar --list --gzip --file "$probe_dir/codex.tar.gz")" == codex-x86_64-unknown-linux-musl ]]
          tar --extract --gzip --file "$probe_dir/codex.tar.gz" --directory "$probe_dir" -- codex-x86_64-unknown-linux-musl
          printf '%s  %s\n' cdcb45aaa01d0f14e298985e09465aebccd47f64ecd298aea44814af7b62bbda "$probe_dir/codex-x86_64-unknown-linux-musl" | sha256sum --check --strict
      - name: Required real Core, sandbox, local Git, MCP, Chrome and protocol acceptance
        # Hard-fails unless bubblewrap, Chrome and system Python cryptography
        # are available; never launches the browser on the host network.
        shell: bash
        run: |
          bash tests/nz12_ci_host.sh python -B tests/nz12_source_runner.py tests/nz12_ci_acceptance.py --output "$RUNNER_TEMP/aioa-nz12-acceptance-${{ matrix.python-version }}" --codex "$RUNNER_TEMP/aioa-codex-probe/codex-x86_64-unknown-linux-musl"
      - name: Chat and console transport regressions
        run: node --test tests/*.test.cjs
      - name: Full Core suite and native authority regressions
        run: |
          bash tests/nz12_ci_host.sh python - <<'PY'
          import runtime
          import hashlib
          import json
          import os
          import sys
          import unittest
          from pathlib import Path

          assert Path(runtime.__file__).resolve() == Path.cwd() / 'runtime/__init__.py'

          allowed_skips = {
              ('test_main.RuntimeArchitectureTests.test_bootstrap_local_context_opens_url_before_model', 'Playwright is not installed'),
              ('test_main.RuntimeArchitectureTests.test_browser_open_search_screenshot_visible_text_and_navigation', 'Playwright is not installed'),
              ('unittest.loader.ModuleSkipped.test_tui_phase1', 'optional dependency textual is not installed'),
              ('unittest.loader.ModuleSkipped.test_tui_phase2', 'optional dependency textual is not installed'),
              ('test_nvidia_trajectory_export.NvidiaTrajectoryExportTest.test_projection_validates_with_pinned_nvidia_atif_model', 'set NVIDIA_NAT_ATIF_SITE to pinned NVIDIA NeMo Agent Toolkit site'),
          }
          seen = set()
          def unique(suite):
              selected = unittest.TestSuite()
              for item in suite:
                  if isinstance(item, unittest.TestSuite):
                      selected.addTest(unique(item))
                  elif item.id() not in seen:
                      seen.add(item.id())
                      selected.addTest(item)
              return selected
          suite = unique(unittest.defaultTestLoader.discover('tests', pattern='test*.py'))
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          skips = {(test.id(), reason) for test, reason in result.skipped}
          print(json.dumps({'tested_sha': os.environ['AIOA_TESTED_SHA'], 'unique_ids': len(seen),
                            'tests_run': result.testsRun, 'skips': sorted(skips),
                            'test_ids_sha256': hashlib.sha256(json.dumps(sorted(seen)).encode()).hexdigest()}))
          if not result.wasSuccessful() or not skips <= allowed_skips or result.testsRun != len(seen):
              sys.exit(1)
          PY
      - name: Architecture, provenance and license
        run: |
          python -B tests/nz12_source_policy.py
          python -m runtime.tools.nonzero_architecture --project-root .
      - name: Native and integration Ruff scopes
        run: |
          ruff check --no-cache --isolated --target-version py311 --select E4,E7,E9,F,I,UP,B,SIM,RUF runtime/nonzero_cloudops
          ruff check --no-cache runtime/nonzero_cloudops/__init__.py runtime/nonzero_cloudops/service.py runtime/tools/nonzero_architecture.py tests/test_nonzero_*.py
          ruff check --no-cache --isolated --target-version py311 --select E4,E7,E9,F,I,UP,B,SIM,RUF runtime/mission/repository_worker.py tests/nz12_*.py tests/test_nz12_*.py
      - name: Python 3.11 AST and interpreter compilation
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          for directory in ('runtime', 'tests'):
              for path in Path(directory).rglob('*.py'):
                  source = path.read_text(encoding='utf-8')
                  ast.parse(source, filename=str(path), feature_version=(3, 11))
                  compile(source, str(path), 'exec', dont_inherit=True)
          PY
      - name: Installed command discovery
        run: |
          aioa-sparkhat --help
          aioa-sparkhat-web --help
          python -c 'import runtime; from nonzero_cloudops import module_descriptor; assert module_descriptor()["available"]'
      - name: Preserve bounded offline acceptance receipts
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nz12-offline-receipts-${{ matrix.python-version }}
          path: |
            ${{ runner.temp }}/aioa-nz12-acceptance-${{ matrix.python-version }}/*.log
            ${{ runner.temp }}/aioa-nz12-acceptance-${{ matrix.python-version }}/*.json
            ${{ runner.temp }}/aioa-nz12-acceptance-${{ matrix.python-version }}/kernel/result.json
            ${{ runner.temp }}/aioa-nz12-acceptance-${{ matrix.python-version }}/observer/result.json
            ${{ runner.temp }}/aioa-nz12-acceptance-${{ matrix.python-version }}/sandbox-matrix/PRODUCT_MATRIX_RESULT.json
            ${{ runner.temp }}/aioa-nz12-acceptance-${{ matrix.python-version }}/sandbox-matrix/PRODUCT_MATRIX_CONFIG/run-*/receipt.json
          if-no-files-found: warn
          retention-days: 14
