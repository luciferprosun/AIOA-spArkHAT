name: Core and native NonZero

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packaging:
    name: Installed packaging (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned packaging test tools
        run: python -m pip install pip==25.2 setuptools==80.9.0 wheel==0.45.1
      - name: Build and test wheel and sdist without source imports or Textual
        run: python -B tests/packaging_acceptance.py --output "$RUNNER_TEMP/aioa-packaging-${{ matrix.python-version }}"

  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    env:
      PYTHONNOUSERSITE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      AWS_CONFIG_FILE: /dev/null
      AWS_SHARED_CREDENTIALS_FILE: /dev/null
      AWS_EC2_METADATA_DISABLED: 'true'
      OTEL_TRACES_EXPORTER: none
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install one Core package and check dependencies
        run: |
          python -m pip install '.[nonzero]' ruff==0.16.7 cryptography==41.0.7 PyYAML==6.0.3
          python -m pip check
      - name: NVIDIA isolated reviewer preflight
        working-directory: ${{ runner.temp }}
        run: python -I -B "$GITHUB_WORKSPACE/scripts/nvidia_reviewer_preflight.py" --root "$RUNNER_TEMP/aioa-nvidia-reviewer-${{ matrix.python-version }}"
      - name: Install pinned isolated browser prerequisites on hosted Noble
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          [[ "${RUNNER_ENVIRONMENT:-}" == github-hosted ]]
          [[ "${RUNNER_OS:-}" == Linux && "${RUNNER_ARCH:-}" == X64 ]]
          . /etc/os-release
          [[ "$ID" == ubuntu && "$VERSION_ID" == 24.04 && "${VERSION_CODENAME:-}" == noble ]]
          [[ "$(/usr/bin/dpkg --print-architecture)" == amd64 ]]
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes bubblewrap=0.9.0-1ubuntu0.3 python3-cryptography=41.0.7-4ubuntu0.4
          dpkg-query --show --showformat='${Package}=${Version}\n' bubblewrap python3-cryptography
      - name: Required isolated Chrome device console regression
        # Hard-fails unless bubblewrap, Chrome and system Python cryptography
        # are available; never launches the browser on the host network.
        shell: bash
        run: |
          set -euo pipefail
          [[ "${RUNNER_ENVIRONMENT:-}" == github-hosted ]]
          [[ "${RUNNER_OS:-}" == Linux && "${RUNNER_ARCH:-}" == X64 ]]
          . /etc/os-release
          [[ "$ID" == ubuntu && "$VERSION_ID" == 24.04 && "${VERSION_CODENAME:-}" == noble ]]
          [[ "$(/usr/bin/dpkg --print-architecture)" == amd64 ]]
          apparmor_enabled="$(cat /sys/module/apparmor/parameters/enabled)"
          userns_restriction="$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)"
          printf 'AppArmor enabled=%s userns_restriction=%s\n' "$apparmor_enabled" "$userns_restriction"
          umask 077
          policy_file="$(mktemp "$RUNNER_TEMP/aioa-ci-bwrap.XXXXXX")"
          profile_loaded=0
          cleanup() {
            status=$?
            trap - EXIT
            if [[ "$profile_loaded" == 1 ]]; then
              if ! sudo /usr/sbin/apparmor_parser --remove --skip-cache "$policy_file"; then status=1; fi
            fi
            if ! rm -- "$policy_file"; then status=1; fi
            exit "$status"
          }
          trap cleanup EXIT
          cat > "$policy_file" <<'APPARMOR'
          abi <abi/4.0>,
          profile aioa-ci-bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          APPARMOR
          echo 'Temporary AppArmor userns profile: aioa-ci-bwrap (/usr/bin/bwrap)'
          sudo /usr/sbin/apparmor_parser --add --skip-cache "$policy_file"
          profile_loaded=1
          /usr/bin/python3 -B tests/mobile_device_console_browser.py
      - name: Full Core suite and native authority regressions
        run: |
          python - <<'PY'
          import runtime
          import sys
          import unittest

          allowed_skips = {
              ('test_main.RuntimeArchitectureTests.test_bootstrap_local_context_opens_url_before_model', 'Playwright is not installed'),
              ('test_main.RuntimeArchitectureTests.test_browser_open_search_screenshot_visible_text_and_navigation', 'Playwright is not installed'),
              ('unittest.loader.ModuleSkipped.test_tui_phase1', 'optional dependency textual is not installed'),
              ('unittest.loader.ModuleSkipped.test_tui_phase2', 'optional dependency textual is not installed'),
              ('test_nvidia_trajectory_export.NvidiaTrajectoryExportTest.test_projection_validates_with_pinned_nvidia_atif_model', 'set NVIDIA_NAT_ATIF_SITE to pinned NVIDIA NeMo Agent Toolkit site'),
          }
          for pattern in ('test*.py', 'test_nonzero_*.py'):
              suite = unittest.defaultTestLoader.discover('tests', pattern=pattern)
              result = unittest.TextTestRunner(verbosity=2).run(suite)
              skips = {(test.id(), reason) for test, reason in result.skipped}
              allowed = allowed_skips if pattern == 'test*.py' else set()
              if not result.wasSuccessful() or not skips <= allowed:
                  sys.exit(1)
          PY
      - name: Architecture, provenance and license
        run: python -m runtime.tools.nonzero_architecture --project-root .
      - name: Native and integration Ruff scopes
        run: |
          ruff check --no-cache --isolated --target-version py311 --select E4,E7,E9,F,I,UP,B,SIM,RUF runtime/nonzero_cloudops
          ruff check --no-cache runtime/nonzero_cloudops/__init__.py runtime/nonzero_cloudops/service.py runtime/tools/nonzero_architecture.py tests/test_nonzero_*.py
      - name: Python 3.11 AST and interpreter compilation
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          for directory in ('runtime', 'tests'):
              for path in Path(directory).rglob('*.py'):
                  source = path.read_text(encoding='utf-8')
                  ast.parse(source, filename=str(path), feature_version=(3, 11))
                  compile(source, str(path), 'exec', dont_inherit=True)
          PY
      - name: Installed command discovery
        run: |
          aioa-sparkhat --help
          aioa-sparkhat-web --help
          python -c 'import runtime; from nonzero_cloudops import module_descriptor; assert module_descriptor()["available"]'
