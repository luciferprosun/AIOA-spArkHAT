name: Android DEBUG (manual owner review)

"on":
  workflow_dispatch:
    inputs:
      expected_source_sha:
        description: Exact reviewed main commit (40 hex); must equal the dispatched main SHA
        required: true
        type: string
      expected_runner_image:
        description: Owner-reviewed ubuntu24 ImageVersion from official actions/runner-images release
        required: true
        type: string
      expected_workflow_revision:
        description: Owner-reviewed SHA-256 of this workflow; must match the pinned policy and checked-out bytes
        required: true
        type: string
      approve_run:
        description: I authorize this build and have checked Actions billing and dependency network access
        required: true
        type: boolean
        default: false
      sdk_license_ack:
        description: I am authorized to use the image's existing Android SDK license records
        required: true
        type: boolean
        default: false
      artifact_exposure_ack:
        description: I checked repo visibility and accept DEBUG APK evidence access and one-day retention
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-manual-debug
  cancel-in-progress: false

jobs:
  debug-apk:
    if: >-
      github.repository == 'luciferprosun/AIOA-spArkHAT' &&
      github.ref == 'refs/heads/main' &&
      inputs.approve_run && inputs.sdk_license_ack && inputs.artifact_exposure_ack
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      AIOA_SOURCE_SHA: ${{ inputs.expected_source_sha }}
      AIOA_RUNNER_IMAGE: ${{ inputs.expected_runner_image }}
      AIOA_WORKFLOW_REVISION: ${{ inputs.expected_workflow_revision }}
      AIOA_APPROVE_RUN: ${{ inputs.approve_run }}
      AIOA_SDK_LICENSE_ACK: ${{ inputs.sdk_license_ack }}
      AIOA_ARTIFACT_ACK: ${{ inputs.artifact_exposure_ack }}
    steps:
      - name: Checkout exact dispatched commit without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, node24
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          clean: false
          fetch-depth: 1
          fetch-tags: false
          submodules: false
          lfs: false
          set-safe-directory: false
      - name: Set up exact Temurin JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0, node24
        with:
          distribution: temurin
          java-version: 17.0.21+9
          architecture: x64
          java-package: jdk
          check-latest: false
          cache-jdk: false
          overwrite-settings: false
          settings-path: ${{ runner.temp }}/aioa-java-settings
      - name: Verify image, existing SDK license, wrapper; test, lint, build and inspect DEBUG APK
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 -B scripts/android/ci_build.py --source-sha "$AIOA_SOURCE_SHA" --runner-image "$AIOA_RUNNER_IMAGE"
      - name: Upload only verified DEBUG APK and filtered evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, node24
        with:
          name: aioa-companion-debug-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/aioa-android-${{ github.run_id }}-${{ github.run_attempt }}/artifact/aioa-companion-debug.apk
            ${{ runner.temp }}/aioa-android-${{ github.run_id }}-${{ github.run_attempt }}/artifact/APK_EVIDENCE.json
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: false
          overwrite: false
