name: Android DEBUG (manual owner review)

"on":
  workflow_dispatch:
    inputs:
      build_profile:
        description: STRICT preserves exact image identity; DEBUG_TOOLCHAIN_V1 is the bounded Noble exception; DEBUG_UBUNTU22_V1 requires the published Jammy image
        required: true
        type: choice
        options: [STRICT, DEBUG_TOOLCHAIN_V1, DEBUG_UBUNTU22_V1]
        default: STRICT
      debug_environment_ack:
        description: I accept the documented DEBUG image mismatch and runner-provided SDK trust for this single build
        required: true
        type: boolean
        default: false
      expected_source_sha:
        description: Exact reviewed main commit (40 hex); must equal the dispatched main SHA
        required: true
        type: string
      expected_runner_image:
        description: "Exact published ImageVersion for the selected profile: Noble 20261026.354.1 or Jammy 20261026.341.1"
        required: true
        type: string
      expected_workflow_revision:
        description: Owner-reviewed SHA-256 of this workflow; must match the pinned policy and checked-out bytes
        required: true
        type: string
      approve_run:
        description: I authorize this build and have checked Actions billing and dependency network access
        required: true
        type: boolean
        default: false
      sdk_license_ack:
        description: I am authorized to use the image's existing Android SDK license records
        required: true
        type: boolean
        default: false
      artifact_exposure_ack:
        description: I checked repo visibility and accept DEBUG APK evidence access and one-day retention
        required: true
        type: boolean
        default: false
      enable_codeql:
        description: Also compile Kotlin under CodeQL and run all required language analyses
        required: true
        type: boolean
        default: false
      codeql_settings_ack:
        description: Owner approved the reviewed advanced CodeQL migration and scoped SARIF upload permission
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-manual-debug
  cancel-in-progress: false

jobs:
  debug-apk:
    permissions:
      contents: read
    if: >-
      github.repository == 'luciferprosun/AIOA-spArkHAT' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'luciferprosun' && github.triggering_actor == 'luciferprosun' &&
      github.run_attempt == '1' && inputs.expected_source_sha == github.sha &&
      inputs.approve_run && inputs.sdk_license_ack && inputs.artifact_exposure_ack
    runs-on: ${{ inputs.build_profile == 'DEBUG_UBUNTU22_V1' && 'ubuntu-22.04' || 'ubuntu-24.04' }}
    timeout-minutes: 35
    env:
      AIOA_BUILD_PROFILE: ${{ inputs.build_profile }}
      AIOA_DEBUG_ENVIRONMENT_ACK: ${{ inputs.debug_environment_ack }}
      AIOA_SOURCE_SHA: ${{ inputs.expected_source_sha }}
      AIOA_RUNNER_IMAGE: ${{ inputs.expected_runner_image }}
      AIOA_WORKFLOW_REVISION: ${{ inputs.expected_workflow_revision }}
      AIOA_APPROVE_RUN: ${{ inputs.approve_run }}
      AIOA_SDK_LICENSE_ACK: ${{ inputs.sdk_license_ack }}
      AIOA_ARTIFACT_ACK: ${{ inputs.artifact_exposure_ack }}
      AIOA_CODEQL_REQUESTED: ${{ inputs.enable_codeql }}
      AIOA_CODEQL_ACK: ${{ inputs.codeql_settings_ack }}
      AIOA_CODEQL_PROFILE: ${{ vars.AIOA_CODEQL_PROFILE }}
    steps:
      - name: Reject unreviewed image before checkout or tool setup
        id: image_check
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import hashlib
          import json
          import os
          import re
          import stat

          IMAGE_PATH = '/imagegeneration/imagedata.json'
          EXPECTED_IMAGE = '20261026.354.1'

          def read_image():
              parent = os.lstat(os.path.dirname(IMAGE_PATH))
              if not stat.S_ISDIR(parent.st_mode) or parent.st_uid != 0 or parent.st_mode & 0o022:
                  raise SystemExit('BLOCKED_CI_IMAGE_METADATA_DIRECTORY')
              fd = os.open(IMAGE_PATH, os.O_RDONLY | os.O_NOFOLLOW | os.O_CLOEXEC)
              try:
                  before = os.fstat(fd)
                  if not stat.S_ISREG(before.st_mode) or before.st_uid != 0 or before.st_mode & 0o022 or not 0 < before.st_size <= 65536:
                      raise SystemExit('BLOCKED_CI_IMAGE_METADATA_FILE')
                  raw = os.read(fd, 65537)
                  after = os.fstat(fd)
                  if len(raw) != before.st_size or (before.st_size, before.st_mtime_ns) != (after.st_size, after.st_mtime_ns):
                      raise SystemExit('BLOCKED_CI_IMAGE_METADATA_RACE')
                  return raw
              finally:
                  os.close(fd)

          def check_image(raw, environment):
              profile = environment.get('AIOA_BUILD_PROFILE', 'STRICT')
              if profile not in ('STRICT', 'DEBUG_TOOLCHAIN_V1', 'DEBUG_UBUNTU22_V1'):
                  raise SystemExit('BLOCKED_CI_BUILD_PROFILE')
              if profile in ('DEBUG_TOOLCHAIN_V1', 'DEBUG_UBUNTU22_V1') and (environment.get('AIOA_DEBUG_ENVIRONMENT_ACK') != 'true' or environment.get('AIOA_CODEQL_REQUESTED') != 'false'):
                  raise SystemExit('BLOCKED_CI_DEBUG_PROFILE_CONSENT')
              expected_image = '20261026.341.1' if profile == 'DEBUG_UBUNTU22_V1' else EXPECTED_IMAGE
              expected_os = 'ubuntu-22.04' if profile == 'DEBUG_UBUNTU22_V1' else 'ubuntu-24.04'
              try:
                  data = json.loads(raw)
                  if type(data) is not list or not 0 < len(data) <= 16 or any(type(row) is not dict for row in data):
                      raise ValueError('shape')
                  rows = [row for row in data if row.get('group') == 'Runner Image']
                  if len(rows) != 1 or type(rows[0].get('detail')) is not str:
                      raise ValueError('image row')
                  detail = rows[0]['detail']
                  versions = re.findall(r'^Version: ([0-9]{8}\.[0-9]{1,4}\.[0-9]{1,4})$', detail, re.M)
                  images = re.findall(r'^Image: (ubuntu-[0-9.]+)$', detail, re.M)
                  observed = versions[0] if len(versions) == 1 else 'INVALID'
                  declared = environment.get('ImageVersion', '')
                  if not re.fullmatch(r'[0-9]{8}\.[0-9]{1,4}\.[0-9]{1,4}', declared):declared = 'INVALID'
                  snapshot = {'metadata_version': observed, 'declared_version': declared, 'metadata_sha256': hashlib.sha256(raw).hexdigest()}
                  mismatch = images != [expected_os] or observed != expected_image or environment.get('ImageVersion') != observed
                  exception = (profile == 'DEBUG_TOOLCHAIN_V1' and images == ['ubuntu-24.04'] and observed == '20261025.353.1' and declared == EXPECTED_IMAGE
                      and snapshot['metadata_sha256'] == '6d35057ab003af4dc74998526957d7bde2e5526e1da06b4ed93201f6fa82e8ba')
                  exception = exception or (profile == 'DEBUG_UBUNTU22_V1' and images == ['ubuntu-22.04']
                      and observed == '20261025.340.1' and declared == '20261026.341.1'
                      and snapshot['metadata_sha256'] == '08a840f7186e0ab52ee613d5cafee66d245430928627dd25f6dc638bdd7e481f')
                  snapshot.update(build_profile=profile, image_identity_status='MISMATCH_ACCEPTED_DEBUG' if mismatch and exception else 'MISMATCH' if mismatch else 'MATCHED')
                  print(json.dumps(snapshot, sort_keys=True), flush=True)
                  if mismatch and not exception:
                      raise SystemExit('BLOCKED_CI_IMAGE_METADATA_MISMATCH observed=' + observed)
                  return snapshot
              except (ValueError, TypeError, KeyError):
                  raise SystemExit('BLOCKED_CI_IMAGE_METADATA_FORMAT') from None

          if __name__ == '__main__':
              snapshot = check_image(read_image(), os.environ)
              with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
                  output.write('snapshot=' + json.dumps(snapshot, sort_keys=True) + '\n')
          PY
          if [[ "$AIOA_BUILD_PROFILE" == 'DEBUG_UBUNTU22_V1' ]]; then
            test "$ImageVersion" = '20261026.341.1'
          else
            test "$ImageVersion" = '20261026.354.1'
          fi
      - name: Checkout exact dispatched commit without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, node24
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          clean: false
          fetch-depth: 1
          fetch-tags: false
          submodules: false
          lfs: false
          set-safe-directory: false
      - name: Verify immutable source workflow and existing SDK before tool acquisition
        env:
          AIOA_IMAGE_SNAPSHOT: ${{ steps.image_check.outputs.snapshot }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 -B scripts/android/ci_build.py --source-sha "$AIOA_SOURCE_SHA" --runner-image "$AIOA_RUNNER_IMAGE" --preflight-only
      - name: Verify image, existing SDK license, wrapper; test, lint, build and inspect DEBUG APK
        id: controlled_build
        env:
          AIOA_IMAGE_SNAPSHOT: ${{ steps.image_check.outputs.snapshot }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 -B scripts/android/ci_build.py --source-sha "$AIOA_SOURCE_SHA" --runner-image "$AIOA_RUNNER_IMAGE"
      - name: Upload only verified DEBUG APK and filtered evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, node24
        with:
          name: aioa-companion-debug-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/aioa-android-${{ github.run_id }}-${{ github.run_attempt }}/artifact/aioa-companion-debug.apk
            ${{ runner.temp }}/aioa-android-${{ github.run_id }}-${{ github.run_attempt }}/artifact/APK_EVIDENCE.json
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: false
          overwrite: false
      - name: Retain filtered failure diagnostics without raw logs or APK
        if: ${{ failure() && steps.controlled_build.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aioa-build-failure-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/aioa-failure-${{ github.run_id }}-${{ github.run_attempt }}-apk/BUILD_FAILURE_EVIDENCE.json
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: false
          overwrite: false

  codeql-static:
    needs: debug-apk
    if: >-
      github.repository == 'luciferprosun/AIOA-spArkHAT' &&
      github.ref == 'refs/heads/main' && inputs.approve_run &&
      github.actor == 'luciferprosun' && github.triggering_actor == 'luciferprosun' &&
      github.run_attempt == '1' && inputs.expected_source_sha == github.sha &&
      inputs.sdk_license_ack && inputs.artifact_exposure_ack &&
      inputs.enable_codeql && inputs.codeql_settings_ack &&
      inputs.build_profile == 'STRICT' &&
      vars.AIOA_CODEQL_PROFILE == 'advanced-v1'
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/codeql-static.yml
    with:
      source_sha: ${{ inputs.expected_source_sha }}

  codeql-kotlin:
    needs: debug-apk
    if: >-
      github.repository == 'luciferprosun/AIOA-spArkHAT' &&
      github.ref == 'refs/heads/main' && inputs.approve_run &&
      github.actor == 'luciferprosun' && github.triggering_actor == 'luciferprosun' &&
      github.run_attempt == '1' && inputs.expected_source_sha == github.sha &&
      inputs.sdk_license_ack && inputs.artifact_exposure_ack &&
      inputs.enable_codeql && inputs.codeql_settings_ack &&
      inputs.build_profile == 'STRICT' &&
      vars.AIOA_CODEQL_PROFILE == 'advanced-v1'
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      AIOA_SOURCE_SHA: ${{ inputs.expected_source_sha }}
      AIOA_RUNNER_IMAGE: ${{ inputs.expected_runner_image }}
      AIOA_WORKFLOW_REVISION: ${{ inputs.expected_workflow_revision }}
      AIOA_APPROVE_RUN: ${{ inputs.approve_run }}
      AIOA_SDK_LICENSE_ACK: ${{ inputs.sdk_license_ack }}
      AIOA_ARTIFACT_ACK: ${{ inputs.artifact_exposure_ack }}
      AIOA_CODEQL_REQUESTED: ${{ inputs.enable_codeql }}
      AIOA_CODEQL_ACK: ${{ inputs.codeql_settings_ack }}
      AIOA_CODEQL_PROFILE: ${{ vars.AIOA_CODEQL_PROFILE }}
    steps:
      - name: Reject unreviewed image before checkout or tool setup
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import hashlib
          import json
          import os
          import re
          import stat

          IMAGE_PATH = '/imagegeneration/imagedata.json'
          EXPECTED_IMAGE = '20261026.354.1'

          def read_image():
              parent = os.lstat(os.path.dirname(IMAGE_PATH))
              if not stat.S_ISDIR(parent.st_mode) or parent.st_uid != 0 or parent.st_mode & 0o022:
                  raise SystemExit('BLOCKED_CI_IMAGE_METADATA_DIRECTORY')
              fd = os.open(IMAGE_PATH, os.O_RDONLY | os.O_NOFOLLOW | os.O_CLOEXEC)
              try:
                  before = os.fstat(fd)
                  if not stat.S_ISREG(before.st_mode) or before.st_uid != 0 or before.st_mode & 0o022 or not 0 < before.st_size <= 65536:
                      raise SystemExit('BLOCKED_CI_IMAGE_METADATA_FILE')
                  raw = os.read(fd, 65537)
                  after = os.fstat(fd)
                  if len(raw) != before.st_size or (before.st_size, before.st_mtime_ns) != (after.st_size, after.st_mtime_ns):
                      raise SystemExit('BLOCKED_CI_IMAGE_METADATA_RACE')
                  return raw
              finally:
                  os.close(fd)

          def check_image(raw, environment):
              try:
                  data = json.loads(raw)
                  if type(data) is not list or not 0 < len(data) <= 16 or any(type(row) is not dict for row in data):
                      raise ValueError('shape')
                  rows = [row for row in data if row.get('group') == 'Runner Image']
                  if len(rows) != 1 or type(rows[0].get('detail')) is not str:
                      raise ValueError('image row')
                  detail = rows[0]['detail']
                  versions = re.findall(r'^Version: ([0-9]{8}\.[0-9]{1,4}\.[0-9]{1,4})$', detail, re.M)
                  images = re.findall(r'^Image: (ubuntu-[0-9.]+)$', detail, re.M)
                  observed = versions[0] if len(versions) == 1 else 'INVALID'
                  declared = environment.get('ImageVersion', '')
                  if not re.fullmatch(r'[0-9]{8}\.[0-9]{1,4}\.[0-9]{1,4}', declared):declared = 'INVALID'
                  snapshot = {'metadata_version': observed, 'declared_version': declared, 'metadata_sha256': hashlib.sha256(raw).hexdigest()}
                  print(json.dumps(snapshot, sort_keys=True), flush=True)
                  if images != ['ubuntu-24.04'] or observed != EXPECTED_IMAGE or environment.get('ImageVersion') != observed:
                      raise SystemExit('BLOCKED_CI_IMAGE_METADATA_MISMATCH observed=' + observed)
                  return snapshot
              except (ValueError, TypeError, KeyError):
                  raise SystemExit('BLOCKED_CI_IMAGE_METADATA_FORMAT') from None

          if __name__ == '__main__':
              check_image(read_image(), os.environ)
          PY
          test "$ImageVersion" = '20261026.354.1'
      - name: Checkout exact reviewed main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          clean: false
          fetch-depth: 1
          fetch-tags: false
          submodules: false
          lfs: false
          set-safe-directory: false
      - name: Verify source owner workflow and existing SDK before tool acquisition
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 -B scripts/android/ci_build.py --source-sha "$AIOA_SOURCE_SHA" --runner-image "$AIOA_RUNNER_IMAGE" --purpose codeql --preflight-only
      - name: Initialize real Kotlin database
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: java-kotlin
          build-mode: manual
          tools: https://github.com/github/codeql-action/releases/download/codeql-bundle-v2.27.3/codeql-bundle-linux64.tar.gz
          db-location: ${{ runner.temp }}/aioa-codeql-databases
          dependency-caching: false
          threads: 1
          ram: 2048
      - name: Compile Kotlin through the existing bounded builder under CodeQL tracing
        id: controlled_build
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 -B scripts/android/ci_build.py --source-sha "$AIOA_SOURCE_SHA" --runner-image "$AIOA_RUNNER_IMAGE" --purpose codeql
          printf 'JAVA_HOME=%s/aioa-android-%s-%s/jdk-17\n' "$RUNNER_TEMP" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          printf '%s/aioa-android-%s-%s/jdk-17/bin\n' "$RUNNER_TEMP" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_PATH"
      - name: Analyze actual compiled Kotlin and upload SARIF
        id: codeql_analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:java-kotlin
          output: ${{ runner.temp }}/aioa-codeql-sarif
          threads: 1
          ram: 2048
          upload-database: false
      - name: Verify source and actual SARIF readback
        env:
          AIOA_SARIF_ID: ${{ steps.codeql_analyze.outputs.sarif-id }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 -B scripts/android/ci_build.py --source-sha "$AIOA_SOURCE_SHA" --runner-image "$AIOA_RUNNER_IMAGE" --purpose codeql --verify-codeql
      - name: Upload filtered CodeQL evidence only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aioa-codeql-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/aioa-android-${{ github.run_id }}-${{ github.run_attempt }}/codeql-artifact/CODEQL_EVIDENCE.json
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: false
          overwrite: false
      - name: Retain filtered Kotlin build failure diagnostics only
        if: ${{ failure() && steps.controlled_build.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aioa-codeql-build-failure-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/aioa-failure-${{ github.run_id }}-${{ github.run_attempt }}-codeql/BUILD_FAILURE_EVIDENCE.json
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: false
          overwrite: false
