name: AIOA CodeQL (owner-gated advanced profile)

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

concurrency:
  group: codeql-static-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  analyze:
    if: >-
      github.repository == 'luciferprosun/AIOA-spArkHAT' &&
      vars.AIOA_CODEQL_PROFILE == 'advanced-v1'
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        language: [actions, c-cpp, javascript-typescript, python]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Require unchanged requested source
        env:
          EXPECTED_SOURCE: ${{ inputs.source_sha }}
          ACTUAL_SOURCE: ${{ github.sha }}
          EXPECTED_IMAGE: '20261026.354.1'
        shell: bash
        run: |
          set -euo pipefail
          test -z "$EXPECTED_SOURCE" || test "$EXPECTED_SOURCE" = "$ACTUAL_SOURCE"
          test "$ImageVersion" = "$EXPECTED_IMAGE"
          python3 -B - <<'PY'
          import hashlib
          import json
          import os
          import re
          import stat

          IMAGE_PATH = '/imagegeneration/imagedata.json'
          EXPECTED_IMAGE = '20261026.354.1'

          def read_image():
              parent = os.lstat(os.path.dirname(IMAGE_PATH))
              if not stat.S_ISDIR(parent.st_mode) or parent.st_uid != 0 or parent.st_mode & 0o022:
                  raise SystemExit('BLOCKED_CI_IMAGE_METADATA_DIRECTORY')
              fd = os.open(IMAGE_PATH, os.O_RDONLY | os.O_NOFOLLOW | os.O_CLOEXEC)
              try:
                  before = os.fstat(fd)
                  if not stat.S_ISREG(before.st_mode) or before.st_uid != 0 or before.st_mode & 0o022 or not 0 < before.st_size <= 65536:
                      raise SystemExit('BLOCKED_CI_IMAGE_METADATA_FILE')
                  raw = os.read(fd, 65537)
                  after = os.fstat(fd)
                  if len(raw) != before.st_size or (before.st_size, before.st_mtime_ns) != (after.st_size, after.st_mtime_ns):
                      raise SystemExit('BLOCKED_CI_IMAGE_METADATA_RACE')
                  return raw
              finally:
                  os.close(fd)

          def check_image(raw, environment):
              try:
                  data = json.loads(raw)
                  if type(data) is not list or not 0 < len(data) <= 16 or any(type(row) is not dict for row in data):
                      raise ValueError('shape')
                  rows = [row for row in data if row.get('group') == 'Runner Image']
                  if len(rows) != 1 or type(rows[0].get('detail')) is not str:
                      raise ValueError('image row')
                  detail = rows[0]['detail']
                  versions = re.findall(r'^Version: ([0-9]{8}\.[0-9]{1,4}\.[0-9]{1,4})$', detail, re.M)
                  images = re.findall(r'^Image: (ubuntu-[0-9.]+)$', detail, re.M)
                  observed = versions[0] if len(versions) == 1 else 'INVALID'
                  if images != ['ubuntu-24.04'] or observed != EXPECTED_IMAGE or environment.get('ImageVersion') != observed:
                      raise SystemExit('BLOCKED_CI_IMAGE_METADATA_MISMATCH observed=' + observed)
                  return {'metadata_version': observed, 'metadata_sha256': hashlib.sha256(raw).hexdigest()}
              except (ValueError, TypeError, KeyError):
                  raise SystemExit('BLOCKED_CI_IMAGE_METADATA_FORMAT') from None

          if __name__ == '__main__':
              print(json.dumps(check_image(read_image(), os.environ), sort_keys=True))
          PY
      - name: Checkout analyzed commit without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          clean: false
          fetch-depth: 1
          fetch-tags: false
          submodules: false
          lfs: false
          set-safe-directory: false
      - name: Initialize preserved language analysis
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          tools: https://github.com/github/codeql-action/releases/download/codeql-bundle-v2.27.3/codeql-bundle-linux64.tar.gz
          dependency-caching: false
          threads: 1
          ram: 2048
      - name: Analyze and upload preserved language SARIF
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
          upload-database: false
          threads: 1
          ram: 2048
