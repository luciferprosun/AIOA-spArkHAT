name: AIOA MCP Bridge

on:
  push:
    branches: [main]
    paths:
      - 'runtime/mcp_bridge/**'
      - 'MCP_Server/**'
      - 'tests/test_mcp_*.py'
      - '.github/workflows/mcp-bridge-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'runtime/mcp_bridge/**'
      - 'MCP_Server/**'
      - 'tests/test_mcp_*.py'
      - '.github/workflows/mcp-bridge-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: MCP contract (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned offline Ed25519 test dependency
        run: python -m pip install cryptography==41.0.7
      - name: Compile bridge
        run: python -m compileall -q runtime/mcp_bridge tests/test_mcp_*.py
      - name: Run all MCP contract and synthetic authority tests
        run: python -m unittest discover -s tests -p 'test_mcp_*.py' -v
